<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Schicht B - Adler Pelzer</title>
    <link rel="stylesheet" href="style.css">
    <link rel="apple-touch-icon" href="APG.jpg">
</head>
<body>

    <div id="loginBox" class="card">
        <h1>Schicht B Login</h1>
        <label>Benutzername</label>
        <input type="text" id="username">
        <label>Passwort</label>
        <input type="password" id="password">
        <button onclick="loginKontrol()" style="margin-top:20px; background:#1a2a5e;">LOGIN</button>
    </div>

    <div id="mainForm" style="display:none;">
        <div class="card">
            <h1>Schichtbericht</h1>
            <div class="grid">
                <div><label>Datum</label><input type="date" id="datum"></div>
                <div>
                    <label>Schicht</label>
                    <select id="schicht">
                        <option>Frühschicht</option>
                        <option>Spätschicht</option>
                        <option>Nachtschicht</option>
                    </select>
                </div>
            </div>

            <hr>
            <div id="workerContainer"></div>
            <button type="button" id="addWorkerBtn" style="background:#475569;">+ Mitarbeiter</button>

            <hr>
            <label>Anlage</label>
            <select id="anlage">
                <option value="">Wählen...</option>
                <optgroup label="PUR"><option>PUR1</option><option>PUR2</option><option>PUR3</option><option>PUR4</option><option>PUR5</option><option>PUR6</option><option>PUR7</option><option>PUR8</option><option>PUR9</option></optgroup>
                <optgroup label="IM"><option>CIM1</option><option>IM1</option><option>IM2</option><option>IM3</option><option>IM4</option><option>IM5</option></optgroup>
                <optgroup label="COM"><option value="COM">Compound Anlage</option></optgroup>
            </select>

            <div id="ftBox" style="display:none; margin-top:15px;">
                <label>Formträger (FT)</label>
                <div style="display:grid; grid-template-columns: 1fr 1fr; gap:5px;">
                    <label><input type="checkbox" class="ft-check"> FT1</label><label><input type="checkbox" class="ft-check"> FT2</label>
                    <label><input type="checkbox" class="ft-check"> FT3</label><label><input type="checkbox" class="ft-check"> FT4</label>
                    <label><input type="checkbox" class="ft-check"> FT5</label><label><input type="checkbox" class="ft-check"> FT6</label>
                </div>
            </div>

            <div id="gesamtDauerBox" style="display:none; margin-top:15px;">
                <label>Gesamtzeit (Min)</label>
                <input type="number" id="gesamtDauerInput" value="480">
            </div>

            <hr>
            <div id="artikelContainer"></div>
            <button type="button" id="addArtikelBtn" style="background:#475569;">+ Artikel</button>

            <hr>
            <label>WhatsApp Empfänger</label>
            <select id="waEmpfaenger">
                <option value="4917623638794">Herr Keskin Murat</option>
                <option value="4917660909937">Herr Uzun</option>
            </select>

            <button onclick="speichern()" style="background:#10b981; margin-top:30px; font-weight:bold;">SPEICHERN & WHATSAPP</button>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
