<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Schicht B - Adler Pelzer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="loginBox" class="card">
        <h1>Schicht B Login</h1>
        <p>Bitte Benutzerdaten eingeben.</p>
        <label>Benutzername</label>
        <input type="text" id="username">
        <label>Passwort</label>
        <input type="password" id="password">
        <button onclick="loginKontrol()">EINLOGGEN</button>
    </div>

    <div id="mainForm" style="display:none;">
        <div class="card">
            <h1>Schicht B</h1>
            <div class="grid">
                <div>
                    <label>Datum</label>
                    <input type="date" id="datum">
                </div>
                <div>
                    <label>Schicht</label>
                    <select id="schicht">
                        <option>Frühschicht</option>
                        <option>Spätschicht</option>
                        <option>Nachtschicht</option>
                    </select>
                </div>
            </div>
            <hr>
            <h2>Mitarbeiter</h2>
            <div id="workerContainer"></div>
            <button id="addWorkerBtn" class="secondary">+ Mitarbeiter</button>
            <hr>
            <label>Anlage</label>
            <select id="anlage">
                <option value="">Bitte wählen</option>
                <optgroup label="PUR Anlagen">
                    <option>PUR1</option><option>PUR2</option><option>PUR3</option>
                    <option>PUR4</option><option>PUR5</option><option>PUR6</option>
                    <option>PUR7</option><option>PUR8</option><option>PUR9</option>
                </optgroup>
                <optgroup label="Spritzguss">
                    <option>CIM1</option>
                    <option>IM1</option><option>IM2</option><option>IM3</option>
                    <option>IM4</option><option>IM5</option>
                </optgroup>
                <optgroup label="Compound System">
                    <option value="COM">Compound Anlage</option>
                </optgroup>
            </select>

            <div id="ftBox"><label>Formträger (FT)</label><div class="ft-grid"><label><input type="checkbox"> FT1</label><label><input type="checkbox"> FT2</label><label><input type="checkbox"> FT3</label><label><input type="checkbox"> FT4</label><label><input type="checkbox"> FT5</label><label><input type="checkbox"> FT6</label></div></div>
            
            <hr>
            <h2>Produktion</h2>
            <div id="artikelContainer"></div>
            <button id="addArtikelBtn" class="secondary">+ Artikel hinzufügen</button>
            
            <hr>
            <h2>Störungen</h2>
            <div id="stoerungContainer"></div>
            <button id="addStoerungBtn" class="secondary">+ Störung hinzufügen</button>
            
            <hr>
            <label>Empfänger (WA)</label>
            <select id="waEmpfaenger">
                <option value="4917623638794">Herr Keskin Murat</option>
                <option value="4915222616238">Herr Uzun</option>
            </select>
            <button onclick="speichern()" class="main-btn">SPEICHERN & WHATSAPP</button>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
