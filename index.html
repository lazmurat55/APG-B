<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Schicht B - Adler Pelzer</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Schicht B">
    
    <link rel="apple-touch-icon" href="APG.jpg">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="loginBox" class="card">
        <h1>Schicht B Login</h1>
        <p>Bitte Benutzerdaten eingeben.</p>
        <label>Benutzername</label>
        <input type="text" id="username">
        <label>Passwort</label>
        <input type="password" id="password">
        <button onclick="loginKontrol()">EINLOGGEN</button>
    </div>

    <div id="mainForm" style="display:none;">
        <div class="card">
            <h1>Schicht B</h1>
            <p>Produktionssystem | Adler Pelzer Group</p>
            
            <div class="grid">
                <div>
                    <label>Datum</label>
                    <input type="date" id="datum">
                </div>
                <div>
                    <label>Schicht</label>
                    <select id="schicht">
                        <option>Frühschicht</option>
                        <option>Spätschicht</option>
                        <option>Nachtschicht</option>
                    </select>
                </div>
            </div>

            <hr>
            <h2>Mitarbeiter</h2>
            <div id="workerContainer"></div>
            <button id="addWorkerBtn" style="background:#475569;">+ Mitarbeiter hinzufügen</button>

            <hr>
            <label>Anlage wählen</label>
            <select id="anlage">
                <option value="">Bitte wählen</option>
                <optgroup label="PUR Anlagen">
                    <option>PUR1</option><option>PUR2</option><option>PUR3</option>
                    <option>PUR4</option><option>PUR5</option><option>PUR6</option>
                    <option>PUR7</option><option>PUR8</option><option>PUR9</option>
                </optgroup>
                <optgroup label="Spritzguss">
                    <option>CIM1</option>
                    <option>IM1</option><option>IM2</option><option>IM3</option>
                    <option>IM4</option><option>IM5</option>
                </optgroup>
                <optgroup label="Compound System">
                    <option value="COM">Compound Anlage</option>
                </optgroup>
            </select>

            <div id="ftBox" style="display:none;">
                <label>Formträger (FT)</label>
                <div class="ft-grid">
                    <label><input type="checkbox" class="ft-check"> FT1</label>
                    <label><input type="checkbox" class="ft-check"> FT2</label>
                    <label><input type="checkbox" class="ft-check"> FT3</label>
                    <label><input type="checkbox" class="ft-check"> FT4</label>
                    <label><input type="checkbox" class="ft-check"> FT5</label>
                    <label><input type="checkbox" class="ft-check"> FT6</label>
                </div>
            </div>

            <div id="artikelContainer"></div>
            <button id="addArtikelBtn" style="background:#475569;">+ Artikel hinzufügen</button>

            <div id="gesamtDauerBox" style="display:none; background: #f0f4f8; padding: 20px; border-radius: 15px; border: 2px solid #1a2a5e; margin-top: 20px;">
                <label><strong>Gesamt Arbeitszeit (Minuten)</strong></label>
                <input type="number" id="gesamtDauerInput" value="480">
            </div>

            <hr>
            <label>Empfänger auswählen (WhatsApp)</label>
            <select id="waEmpfaenger">
                <option value="4917623638794">Herr Keskin Murat</option>
                <option value="4917660909937">Herr Uzun</option>
            </select>

            <button onclick="speichern()" class="main-btn" style="background:#10b981; font-weight:bold; font-size:18px;">SPEICHERN & SENDEN</button>
        </div>
    </div>

    <script src="app.js"></script>
    <script>
        if ("serviceWorker" in navigator) {
            navigator.serviceWorker.register("service-worker.js");
        }
    </script>
</body>
</html>
