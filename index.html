<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Schicht B - Adler Pelzer</title>
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-touch-icon" href="APG.jpg">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div id="loginBox" class="card">
            <h1>Schicht B Login</h1>
            <p>Produktionssystem | Adler Pelzer Group</p>
            <label>Benutzername</label>
            <input type="text" id="username" placeholder="Dein Name">
            <label>Passwort</label>
            <input type="password" id="password" placeholder="Dein Passwort">
            <button onclick="loginKontrol()" style="background:#1a2a5e; color:white;">EINLOGGEN</button>
        </div>

        <div id="mainForm" style="display:none;">
            <div class="card">
                <h1>Schicht B Bericht</h1>
                <div class="grid">
                    <div><label>Datum</label><input type="date" id="datum"></div>
                    <div>
                        <label>Schicht</label>
                        <select id="schicht">
                            <option>Frühschicht</option>
                            <option>Spätschicht</option>
                            <option>Nachtschicht</option>
                        </select>
                    </div>
                </div>

                <hr>
                <h2>Mitarbeiter</h2>
                <div id="workerContainer"></div>
                <button type="button" id="addWorkerBtn">+ Mitarbeiter hinzufügen</button>

                <hr>
                <label>Anlage wählen</label>
                <select id="anlage">
                    <option value="">Bitte wählen</option>
                    <optgroup label="PUR Anlagen">
                        <option>PUR1</option><option>PUR2</option><option>PUR3</option>
                        <option>PUR4</option><option>PUR5</option><option>PUR6</option>
                        <option>PUR7</option><option>PUR8</option><option>PUR9</option>
                    </optgroup>
                    <optgroup label="Spritzguss">
                        <option>CIM1</option>
                        <option>IM1</option><option>IM2</option><option>IM3</option>
                        <option>IM4</option><option>IM5</option>
                    </optgroup>
                    <optgroup label="Compound System">
                        <option value="COM">Compound Anlage</option>
                    </optgroup>
                </select>

                <div id="ftBox" style="display:none; margin-top:20px;">
                    <label>Formträger (FT)</label>
                    <div class="ft-grid">
                        <label><input type="checkbox" class="ft-check"> FT1</label>
                        <label><input type="checkbox" class="ft-check"> FT2</label>
                        <label><input type="checkbox" class="ft-check"> FT3</label>
                        <label><input type="checkbox" class="ft-check"> FT4</label>
                        <label><input type="checkbox" class="ft-check"> FT5</label>
                        <label><input type="checkbox" class="ft-check"> FT6</label>
                    </div>
                </div>

                <div id="gesamtDauerBox" style="display:none; margin-top:20px;">
                    <label>Gesamt Arbeitszeit (Minuten)</label>
                    <input type="number" id="gesamtDauerInput" value="480">
                </div>

                <hr>
                <h2>Produktion</h2>
                <div id="artikelContainer"></div>
                <button type="button" id="addArtikelBtn">+ Artikel hinzufügen</button>

                <hr>
                <label>WhatsApp Empfänger</label>
                <select id="waEmpfaenger">
                    <option value="4917623638794">Herr Keskin Murat</option>
                    <option value="4917660909937">Herr Uzun</option>
                </select>

                <button onclick="speichern()" class="main-btn">SPEICHERN & SENDEN</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
    <script>
        if ("serviceWorker" in navigator) {
            navigator.serviceWorker.register("service-worker.js");
        }
    </script>
</body>
</html>
