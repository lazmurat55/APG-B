<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Schicht B - Adler Pelzer</title>
    
    <!-- PWA & Mobile App Settings -->
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Schicht B">
    <link rel="apple-touch-icon" href="https://via.placeholder.com/180/ffffff/1a2a5e?text=AP">
    
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="card">
        <h1>Schicht B</h1>
        <p>Produktionssystem | Adler Pelzer Group</p>
        
        <!-- Ana Bilgiler -->
        <div class="grid">
            <div>
                <label>Datum</label>
                <input type="date" id="datum">
            </div>
            <div>
                <label>Schicht</label>
                <select id="schicht">
                    <option>Frühschicht</option>
                    <option>Spätschicht</option>
                    <option>Nachtschicht</option>
                </select>
            </div>
        </div>

        <hr>
        <h2>Mitarbeiter</h2>
        <div id="workerContainer"></div>
        <button id="addWorkerBtn" class="secondary">+ Mitarbeiter hinzufügen</button>

        <hr>
        <label>Anlage wählen</label>
        <select id="anlage">
            <option value="">Bitte wählen</option>
            <optgroup label="PUR Anlagen">
                <option>PUR1</option><option>PUR2</option><option>PUR3</option>
                <option>PUR4</option><option>PUR5</option><option>PUR6</option>
                <option>PUR7</option><option>PUR8</option><option>PUR9</option>
            </optgroup>
            <optgroup label="Spritzguss">
                <option>CIM1</option>
                <option>IM1</option><option>IM2</option><option>IM3</option>
                <option>IM4</option><option>IM5</option>
            </optgroup>
        </select>

        <!-- Formträger (Sadece PUR için görünür) -->
        <div id="ftBox">
            <label>Formträger (FT)</label>
            <div class="ft-grid">
                <label><input type="checkbox" value="FT1"> FT1</label>
                <label><input type="checkbox" value="FT2"> FT2</label>
                <label><input type="checkbox" value="FT3"> FT3</label>
                <label><input type="checkbox" value="FT4"> FT4</label>
                <label><input type="checkbox" value="FT5"> FT5</label>
                <label><input type="checkbox" value="FT6"> FT6</label>
            </div>
        </div>

        <div id="artikelContainer"></div>
        <button id="addArtikelBtn" class="secondary">+ Artikel hinzufügen</button>

        <hr>
        <h2>Störungen</h2>
        <div id="stoerungContainer"></div>
        <button id="addStoerungBtn" class="secondary">+ Störung hinzufügen</button>

        <hr>
<!-- WhatsApp Alıcı Seçimi (Kurumsal Format) -->
<label>Empfänger auswählen :</label>
<select id="waEmpfaenger" style="border: 2px solid #1a2a5e; background: #f0f4ff; font-weight: bold;">
    <option value="4917623638794">Herr Keskin Murat</option>
    <option value="4917660909937">Herr Uzun</option>
</select>

<button onclick="speichern()" class="main-btn">SPEICHERN & WHATSAPP</button>
    </div>

    <!-- Scripts -->
    <script src="app.js"></script>
    <script>
        // PWA Kaydı
        if ("serviceWorker" in navigator) {
            navigator.serviceWorker.register("service-worker.js");
        }
        
        // Otomatik Bugünün Tarihi
        document.getElementById("datum").value = new Date().toISOString().split("T")[0];
    </script>
</body>
</html>
